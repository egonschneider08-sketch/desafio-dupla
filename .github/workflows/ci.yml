name: Full Stack CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install minimal runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Flask>=3.1,<4" "Flask-SQLAlchemy>=3.1,<4" "Flask-Migrate>=4.1,<5" "python-dotenv>=1,<2" "pytest>=8,<10"
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
